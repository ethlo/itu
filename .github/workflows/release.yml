name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.18.0'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version from tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Cannot derive a release version from tag '$TAG'"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing $VERSION (tag $TAG)"

      # JDK 21: the proguard profile is active on [9,22), which produces the
      # -small jar published alongside every release since 1.10.x.
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Set release version
        run: mvn -ntp -B versions:set -DnewVersion=${{ env.RELEASE_VERSION }} -DgenerateBackupPoms=false

      - name: Build, sign and publish
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -ntp -B -Prelease clean deploy

  update-readme:
    name: Update README to the released version
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Decide whether to update
        id: decide
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's#.*<itu.released.version>\(.*\)</itu.released.version>.*#\1#p' pom.xml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "Pre-release $VERSION, README stays on $CURRENT"
          elif [[ -n "$CURRENT" && "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
            echo "$VERSION is older than $CURRENT, README stays on $CURRENT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup JDK
        if: steps.decide.outputs.update == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Regenerate README
        if: steps.decide.outputs.update == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          sed -i "s#<itu.released.version>[^<]*</itu.released.version>#<itu.released.version>$VERSION</itu.released.version>#" pom.xml
          mvn -ntp -B -Preadme process-resources

      - name: Commit and push
        if: steps.decide.outputs.update == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898898+github-actions[bot]@users.noreply.github.com"
          git add pom.xml README.md
          if git diff --cached --quiet; then
            echo "README already shows $VERSION"
            exit 0
          fi
          git commit -m "Update README to $VERSION"
          git push origin HEAD:${{ github.event.repository.default_branch }}
